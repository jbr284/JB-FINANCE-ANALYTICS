<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Cirúrgica</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #ffffff; margin: 0; padding: 10px; color: #333; }
        .grid-input { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .grid-input-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { font-size: 12px; font-weight: bold; color: #444; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; font-size: 15px; margin-top: 10px; background-color: #1565c0; transition: transform 0.1s; }
        .btn-action:active { transform: scale(0.98); }
        .section-box { background-color: #e3f2fd; padding: 15px; border-radius: 6px; border: 1px solid #90caf9; margin-bottom: 15px; }
        h4 { margin-top: 0; margin-bottom: 10px; font-size: 13px; color: #0d47a1; border-bottom: 1px solid #bbdefb; padding-bottom: 5px; }
        .title-red { color: #c62828; border-bottom-color: #ffcdd2; }
    </style>
</head>
<body>

    <div class="section-box">
        <h4>📅 Motor de Calendário e DSR</h4>
        <div class="grid-input">
            <div><label>Mês da Folha:</label><input type="month" id="calc-mes-ref"></div>
            <div><label>Feriados Regionais (Ex: 15/08):</label><input type="text" id="calc-feriados-extras" placeholder="Ex: 15/08, 20/11"></div>
        </div>
        <div class="grid-input-3" style="margin-top: 10px;">
            <div><label>Dias Úteis:</label><input type="number" id="calc-diasuteis" readonly style="background: #f0f0f0; font-weight: bold;"></div>
            <div><label>Dom/Feriados:</label><input type="number" id="calc-domferiados" readonly style="background: #f0f0f0; color: #c62828; font-weight: bold;"></div>
            <div><label>Dias do Mês:</label><input type="number" id="calc-dias" readonly style="background: #f0f0f0;"></div>
        </div>
    </div>

    <h4 style="font-size: 12px; color: #333; border-bottom: 1px solid #ccc;">PROVENTOS (Horas Extras e Adicionais)</h4>
    <div class="grid-input-3">
        <div><label>HE 50% (h):</label><input type="number" id="calc-he50" placeholder="0"></div>
        <div><label>HE 60% (h):</label><input type="number" id="calc-he60" placeholder="0"></div>
        <div><label>HE 80% (h):</label><input type="number" id="calc-he80" placeholder="0"></div>
    </div>
    <div class="grid-input-3" style="margin-bottom: 20px;">
        <div><label>HE 100% (h):</label><input type="number" id="calc-he100" placeholder="0"></div>
        <div><label>HE 150% (h):</label><input type="number" id="calc-he150" placeholder="0"></div>
        <div><label>Adic. Noturno:</label><input type="number" id="calc-noturno" placeholder="0"></div>
    </div>

    <h4 class="title-red">DESCONTOS E VARIÁVEIS</h4>
    <div class="grid-input">
        <div><label>Faltas (dias):</label><input type="number" id="calc-faltas" placeholder="0"></div>
        <div><label>Atrasos (horas):</label><input type="number" id="calc-atrasos" placeholder="0"></div>
    </div>
    
    <div class="grid-input-3">
        <div>
            <label>Plano SESI:</label>
            <select id="calc-plano">
                <option value="nenhum">Nenhum</option>
                <option value="basico_individual">Básico Indiv.</option>
                <option value="basico_familiar">Básico Fam.</option>
                <option value="plus_individual">Plus Indiv.</option>
                <option value="plus_familiar">Plus Fam.</option>
            </select>
        </div>
        <div><label>Coparticipação R$:</label><input type="number" id="calc-copart" placeholder="0.00"></div>
        <div><label>Empréstimo R$:</label><input type="number" id="calc-emprestimo" placeholder="0.00"></div>
    </div>
    
    <div class="grid-input-3">
        <div>
            <label>Sindicato:</label>
            <select id="calc-sindicato"><option value="nao">Não</option><option value="sim">Sim</option></select>
        </div>
        <div>
            <label>Desc. VT (6%):</label>
            <select id="calc-vt"><option value="sim">Sim</option><option value="nao">Não</option></select>
        </div>
        <div><label>Dependentes:</label><input type="number" id="calc-dependentes" placeholder="0"></div>
    </div>

    <button class="btn-action" onclick="calcularEEnviarAoERP()">⚙️ Calcular e Enviar ao ERP</button>

    <script>
        // --- MOTOR MATEMÁTICO ---
        const regras = {
            tetoINSS: 8475.55,
            percentualAdiantamento: 0.4,
            percentualAdicionalNoturno: 0.35,
            descontoFixoVA: 23.97,
            percentualVT: 0.06,
            valorSindicato: 50.00, 
            deducaoPorDependenteIRRF: 189.59,
            tabelaINSS: [
              { ate: 1621.00, aliquota: 0.075, deduzir: 0 },
              { ate: 2902.84, aliquota: 0.09, deduzir: 24.32 },
              { ate: 4354.27, aliquota: 0.12, deduzir: 111.40 },
              { ate: 8475.55, aliquota: 0.14, deduzir: 198.49 }
            ],
            tabelaIRRF: [
              { ate: 2428.80, aliquota: 0, deduzir: 0 },
              { ate: 2826.65, aliquota: 0.075, deduzir: 182.16 },
              { ate: 3751.05, aliquota: 0.15, deduzir: 394.16 },
              { ate: 4664.68, aliquota: 0.225, deduzir: 675.49 },
              { ate: "acima", aliquota: 0.275, deduzir: 908.73 }
            ],
            planosSESI: { nenhum: 0, basico_individual: 29, basico_familiar: 58, plus_individual: 120, plus_familiar: 189 }
        };

        // --- CÁLCULO DE CALENDÁRIO AUTOMÁTICO ---
        function atualizarCalendario() {
            const mesStr = document.getElementById('calc-mes-ref').value;
            if (!mesStr) return;

            const [ano, mes] = mesStr.split('-').map(Number);
            const extrasStr = document.getElementById('calc-feriados-extras').value;
            const extrasArray = extrasStr ? extrasStr.split(',').map(d => d.trim()) : [];

            const diasNoMes = new Date(ano, mes, 0).getDate();

            // Cálculo da Páscoa e Feriados Móveis
            const a = ano % 19; const b = Math.floor(ano / 100); const c = ano % 100;
            const d = Math.floor(b / 4); const e = b % 4; const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3); const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4); const k = c % 4; const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const mesPascoa = Math.floor((h + l - 7 * m + 114) / 31);
            const diaPascoa = ((h + l - 7 * m + 114) % 31) + 1;

            const pascoa = new Date(ano, mesPascoa - 1, diaPascoa);
            const sextaSanta = new Date(pascoa); sextaSanta.setDate(pascoa.getDate() - 2);
            const carnaval = new Date(pascoa); carnaval.setDate(pascoa.getDate() - 47);
            const corpusChristi = new Date(pascoa); corpusChristi.setDate(pascoa.getDate() + 60);

            const formatarDDMM = (dt) => String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0');
            const feriadosMoveis = [formatarDDMM(sextaSanta), formatarDDMM(carnaval), formatarDDMM(corpusChristi)];
            const feriadosFixos = ["01/01", "21/04", "01/05", "07/09", "12/10", "02/11", "15/11", "25/12"];

            let diasUteis = 0; let domFeriados = 0;

            for (let dia = 1; dia <= diasNoMes; dia++) {
                const dataAtual = new Date(ano, mes - 1, dia);
                const diaSemana = dataAtual.getDay();
                const dataStr = String(dia).padStart(2, '0') + '/' + String(mes).padStart(2, '0');

                if (diaSemana === 0 || feriadosFixos.includes(dataStr) || feriadosMoveis.includes(dataStr) || extrasArray.includes(dataStr)) {
                    domFeriados++;
                } else {
                    diasUteis++;
                }
            }

            document.getElementById('calc-diasuteis').value = diasUteis;
            document.getElementById('calc-domferiados').value = domFeriados;
            document.getElementById('calc-dias').value = diasNoMes;
        }

        // --- CÁLCULOS DE IMPOSTO ---
        function calcularINSS(base) {
            if (base > regras.tetoINSS) base = regras.tetoINSS;
            for (const faixa of regras.tabelaINSS) {
                if (base <= faixa.ate) return (base * faixa.aliquota) - faixa.deduzir;
            }
            const ultima = regras.tabelaINSS[regras.tabelaINSS.length - 1];
            return (base * ultima.aliquota) - ultima.deduzir;
        }

        function calcularIRRF(baseCalculo, dependentes, rendimentosTributaveis) {
            if (rendimentosTributaveis <= 5000) return 0;
            const deducoesDependentes = dependentes * regras.deducaoPorDependenteIRRF;
            const baseFinal = Math.max(0, baseCalculo - deducoesDependentes);
            let impostoBruto = 0;
            for (const faixa of regras.tabelaIRRF) {
                if (faixa.ate === "acima" || baseFinal <= faixa.ate) { impostoBruto = (baseFinal * faixa.aliquota) - faixa.deduzir; break; }
            }
            if (rendimentosTributaveis > 5000 && rendimentosTributaveis <= 7350) {
                const redutor = 978.62 - (0.133145 * rendimentosTributaveis);
                if (redutor > 0) impostoBruto -= redutor;
            }
            return Math.max(0, impostoBruto);
        }

        // --- INTEGRAÇÃO COM O SISTEMA PRINCIPAL (postMessage) ---
        function calcularEEnviarAoERP() {
            // O iframe consegue ler o localStorage do domínio pai (mesmo site)
            const salarioBase = parseFloat(localStorage.getItem('modular_salario_base')) || 0;
            if (salarioBase <= 0) {
                alert("Configure e Salve o Salário Base Contratual no sistema principal primeiro!");
                return;
            }

            const diasUteis = parseFloat(document.getElementById('calc-diasuteis').value) || 0;
            const domFeriados = parseFloat(document.getElementById('calc-domferiados').value) || 0;

            if (diasUteis === 0 && domFeriados === 0) {
                alert("Selecione o Mês da Folha no calendário para gerar os Dias Úteis e Feriados!");
                return;
            }

            const diasTrab = parseFloat(document.getElementById('calc-dias').value) || 30;
            const dependentes = parseFloat(document.getElementById('calc-dependentes').value) || 0;
            const faltas = parseFloat(document.getElementById('calc-faltas').value) || 0;
            const atrasos = parseFloat(document.getElementById('calc-atrasos').value) || 0;
            const he50 = parseFloat(document.getElementById('calc-he50').value) || 0;
            const he60 = parseFloat(document.getElementById('calc-he60').value) || 0;
            const he80 = parseFloat(document.getElementById('calc-he80').value) || 0;
            const he100 = parseFloat(document.getElementById('calc-he100').value) || 0;
            const he150 = parseFloat(document.getElementById('calc-he150').value) || 0;
            const noturno = parseFloat(document.getElementById('calc-noturno').value) || 0;
            
            const plano = document.getElementById('calc-plano').value;
            const coparticipacao = parseFloat(document.getElementById('calc-copart').value) || 0;
            const sindicato = document.getElementById('calc-sindicato').value;
            const emprestimo = parseFloat(document.getElementById('calc-emprestimo').value) || 0;
            const descontarVT = document.getElementById('calc-vt').value === 'sim';

            const valorDia = salarioBase / 30;
            const valorHora = salarioBase / 220;

            const vencBase = valorDia * diasTrab;
            const valorHE50 = he50 * valorHora * 1.5;
            const valorHE60 = he60 * valorHora * 1.6;
            const valorHE80 = he80 * valorHora * 1.8;
            const valorHE100 = he100 * valorHora * 2.0;
            const valorHE150 = he150 * valorHora * 2.5;
            const valorNoturno = noturno * valorHora * regras.percentualAdicionalNoturno;
            
            const totalHE = valorHE50 + valorHE60 + valorHE80 + valorHE100 + valorHE150;
            const dsrHE = (diasUteis > 0) ? (totalHE / diasUteis) * domFeriados : 0;
            const dsrNoturno = (diasUteis > 0) ? (valorNoturno / diasUteis) * domFeriados : 0;
            
            const totalBruto = vencBase + totalHE + valorNoturno + dsrHE + dsrNoturno;

            const descontoFaltas = faltas * valorDia;
            const descontoAtrasos = atrasos * valorHora;
            const adiantamento = (salarioBase / 30) * diasTrab * regras.percentualAdiantamento;
            const descontoVA = regras.descontoFixoVA;
            const descontoVT = descontarVT ? (salarioBase * regras.percentualVT) : 0;
            
            const baseINSS = totalBruto - descontoFaltas - descontoAtrasos;
            const inss = calcularINSS(baseINSS);
            const baseIRRF = baseINSS - inss;
            const irrf = calcularIRRF(baseIRRF, dependentes, totalBruto);
            
            const descontoPlano = regras.planosSESI[plano] || 0;
            const descontoSindicato = sindicato === 'sim' ? regras.valorSindicato : 0;
            
            const totalDescontos = descontoFaltas + descontoAtrasos + descontoPlano + coparticipacao + descontoSindicato + emprestimo + inss + irrf + descontoVA + adiantamento + descontoVT;
            const liquido = totalBruto - totalDescontos;

            // ENVIAR DADOS AO ERP
            window.parent.postMessage({
                tipo: 'CALCULO_FOLHA_FINALIZADO',
                liquido: liquido,
                adiantamento: adiantamento
            }, '*');
        }

        // Ligar eventos de calendário
        document.getElementById('calc-mes-ref').addEventListener('change', atualizarCalendario);
        document.getElementById('calc-feriados-extras').addEventListener('blur', atualizarCalendario);
    </script>
</body>
</html>
